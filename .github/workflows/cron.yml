name: Process Reservation Reminders

on:
  schedule:
    - cron: '*/1 * * * *'  # Every 1 minutes
  workflow_dispatch:

jobs:
  process-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          # Fail closed: never call the endpoint without the secret.
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "WEBHOOK_SECRET repository secret is not set" >&2
            exit 1
          fi
          curl --fail-with-body -sS -X POST "https://noir-crm-dashboard.vercel.app/api/webhook-process-reminders" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET"
